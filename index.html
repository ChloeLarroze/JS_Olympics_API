<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris 2024 Olympics Venues</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    
    <!-- headers -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Loading Olympic venues...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <script>
        // API URL - change this to your deployed URL when ready
        const API_BASE_DEV = 'http://localhost:3000';
        const API_BASE_PROD = 'https://js_olympics_api.cleverapps.io';
        
        // Initialize map centered on Paris
        const map = L.map('map').setView([48.8566, 2.3522], 11);
        
        // Add tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Custom icon
        const olympicIcon = L.divIcon({
            html: '📍',
            iconSize: [60, 60],
            className: 'custom-div-icon'
        });
        
        //load and display events
        async function loadEvents() {
            try {
                const response = await fetch(`${API_BASE_PROD}/events`); //switch 2 prod TODO 
                const events = await response.json();
                
                //group events by their venue
                const venueGroups = new Map();
                
                events.forEach(event => {
                    event.locations.forEach(location => {
                        //skip locations with missing or invalid coordinates //FIX 
                        if (!location || !location.lat || !location.lng || 
                            isNaN(location.lat) || isNaN(location.lng)) {
                            return;
                        }
                        
                        const key = `${location.venue}-${location.lat}-${location.lng}`;
                        
                        if (!venueGroups.has(key)) {
                            venueGroups.set(key, {
                                location: location,
                                events: []
                            });
                        }
                        
                        venueGroups.get(key).events.push(event);
                    });
                });
                
                //markers for each venue
                venueGroups.forEach((venueData) => {
                    const { location, events } = venueData;
                    
                    const marker = L.marker([location.lat, location.lng], {
                        icon: olympicIcon
                    }).addTo(map);
                    
                    // popup content
                    const eventsList = events.map(event => 
                        `<li><strong>${event.event}</strong> - ${event.sport.name}</li>`
                    ).join('');
                    
                    const popupContent = `
                        <div>
                            <h3>${location.venue}</h3>
                            <p><strong>Events (${events.length}):</strong></p>
                            <ul style="margin: 10px 0; padding-left: 20px; max-height: 200px; overflow-y: auto;">
                                ${eventsList}
                            </ul>
                        </div>
                    `;
                    
                    marker.bindPopup(popupContent, { maxWidth: 300 });
                });
                
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                console.error('Error loading events:', error);
                document.getElementById('loading').innerHTML = 'Error loading events. Check console.';
            }
        }
        
        // Load events when page loads (func call)
        loadEvents();
    </script>
</body>
</html>
